# Example policy: a read-mostly filesystem agent.
#
# Rules are evaluated top to bottom and the FIRST match wins, like firewall
# rules. Anything no rule matches is allowed - an empty policy file is a pure
# passthrough, so you can install the proxy and watch the audit log before
# writing a single rule.
#
# Use it with:
#   GUARDRAILS_POLICY=examples/filesystem-sandbox.yaml McpGuardrails

rules:
  # A glob, so every read tool the server has (or gains later) is covered
  # without listing them. '*' matches any run of characters, '?' exactly one.
  - name: allow-reads
    match:
      tool: fs__read_*
    decision: allow

  - name: allow-listing
    match:
      tool: fs__list_*
    decision: allow

  # Argument predicates narrow a rule to particular calls. This one permits
  # writes, but only inside the sandbox directory.
  #
  # One operator per entry - eq, gt, lt, matches, prefix, not_prefix, in - so
  # that --explain can name the condition that failed. A path the model did not
  # send never satisfies a predicate, including a negated one, so pair these
  # with a catch-all when a missing argument should also be refused.
  - name: allow-sandbox-writes
    match:
      tool: fs__write_*
      args:
        - path: $.path
          prefix: /tmp/guardrails-sandbox/
    decision: allow

  # Reached only when the rule above did not match, i.e. a write aimed outside
  # the sandbox. The message is a prompt, not a log line: an agent that reads
  # this can pick a different approach, whereas one that reads "denied" retries.
  - name: deny-sandbox-escape
    match:
      tool: fs__write_*
    decision: deny
    message: >-
      Writes are confined to /tmp/guardrails-sandbox/. Write your file there, or
      show the user the change instead of applying it.

  # The safety net underneath the named rules: anything the downstream server
  # flags as destructive, including every tool that declares no annotations at
  # all, because the MCP default for destructiveHint is true. This is what
  # covers a tool added next month that nobody has written a rule for yet.
  #
  # Annotations are hints from an upstream server, so treat this as a blanket,
  # not a guarantee - a hostile server can describe its delete tool as harmless.
  - name: deny-destructive
    match:
      annotations:
        destructiveHint: true
    decision: deny
    message: >-
      Destructive tools are disabled in this sandbox. Ask the user to perform
      the change manually if it is genuinely required.
