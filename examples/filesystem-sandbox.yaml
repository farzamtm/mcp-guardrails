# Example policy: a read-mostly filesystem agent.
#
# Rules are evaluated top to bottom and the FIRST match wins, like firewall
# rules. Anything no rule matches is allowed - an empty policy file is a pure
# passthrough, so you can install the proxy and watch the audit log before
# writing a single rule.
#
# The write rules below key on the literal path prefix /tmp/guardrails-sandbox/,
# so point the proxy at that same directory or they will never match. Left to
# itself the proxy uses the platform temp directory, which is only /tmp on
# Linux - on macOS it is /var/folders/**/T/ and on Windows %LOCALAPPDATA%\Temp\,
# and every write would fall through to the denial below.
#
# Use it with:
#   GUARDRAILS_POLICY=examples/filesystem-sandbox.yaml \
#   GUARDRAILS_SANDBOX=/tmp/guardrails-sandbox \
#   McpGuardrails

# How much the agent may do, as opposed to what it may do. The dangerous session
# is rarely the one making a forbidden call - it is the one making a permitted
# call four thousand times.
#
# 'session' is this proxy process, which for an stdio server is one client
# session: the counters start again next time. Costs come from the matched rule
# below, defaulting to 1, so a call cap works even with no cost: anywhere.
budgets:
  session:
    max_calls: 500
    max_cost: 100

# What to do with what comes BACK. Everything else in this file inspects the
# call going out; a file's CONTENT is the one thing no rule above can predict.
#
# This section is here to be read, not because it changes anything: annotate is
# the default, so deleting it leaves the behaviour identical. A proxy with no
# policy file at all still scans - a guardrail that has to be switched on
# protects nobody, and annotating cannot break a call.
#
# 'block' withholds a matching result entirely and returns a tool error. That
# suits a server whose output should be structured data; it is risky for one
# returning prose, because these are heuristics and they do misfire.
# 'off' disables scanning, which is an honest choice to make deliberately.
#
# 'secrets' runs in both directions. The values below are the defaults, spelled
# out: results are scrubbed before the model reads them, and arguments reach the
# server unchanged but the audit log only ever sees markers. Change arguments to
# 'redact' if this server should never receive a credential, or 'block' to
# refuse any call that carries one. pii: true also redacts email addresses and
# card numbers - off by default because they are often the point of the call.
scanners:
  injection:
    action: annotate
  secrets:
    arguments: redact_audit
    results: redact
    pii: false

    # Optional second opinion from Claude. Left commented out because it sends
    # file contents to the Anthropic API, costs money, and needs a key in
    # ANTHROPIC_API_KEY - startup fails without one, by design.
    #
    # The classifier can soften a heuristic 'block' into an annotation but can
    # never remove a warning, so pair it with 'action: block' (withhold only
    # when both stages agree) or 'mode: all' (also catch what the heuristics
    # miss). With 'annotate' + 'confirm' it only adds evidence to the audit log.
    # If it times out or fails, the heuristic verdict stands.
    #
    # classifier:
    #   mode: confirm          # confirm: only flagged results | all: every result
    #   timeout_ms: 5000
    #   max_chars: 32000

rules:
  # A glob, so every read tool the server has (or gains later) is covered
  # without listing them. '*' matches any run of characters, '?' exactly one.
  #
  # cost: 0 spends nothing against max_cost - reading is what you want the agent
  # doing freely. It still counts against max_calls, because a free tool called
  # in a loop is still a loop.
  - name: allow-reads
    match:
      tool: fs__read_*
    decision: allow
    cost: 0

  - name: allow-listing
    match:
      tool: fs__list_*
    decision: allow

  # Argument predicates narrow a rule to particular calls. This one permits
  # writes whose requested path is SPELLED as being under the sandbox.
  #
  # Read that literally: 'prefix' is an ordinal string comparison on the value
  # the model sent. Nothing is resolved or canonicalised, so a path such as
  # /tmp/guardrails-sandbox/../../etc/passwd satisfies it. Real containment is
  # the downstream server's job - server-filesystem is launched with the sandbox
  # as its only allowed root and re-checks every path - and this rule is the
  # layer above that, not a replacement for it.
  #
  # One operator per entry - eq, gt, lt, matches, prefix, not_prefix, in - so
  # that --explain can name the condition that failed. A path the model did not
  # send never satisfies a predicate, including a negated one, so pair these
  # with a catch-all when a missing argument should also be refused.
  #
  # Writes cost 5, so this sandbox tolerates twenty of them before the budget is
  # gone, however many reads happen in between.
  - name: allow-sandbox-writes
    match:
      tool: fs__write_*
      args:
        - path: $.path
          prefix: /tmp/guardrails-sandbox/
    decision: allow
    cost: 5

  # Reached only when the rule above did not match, i.e. a write aimed outside
  # the sandbox. The message is a prompt, not a log line: an agent that reads
  # this can pick a different approach, whereas one that reads "denied" retries.
  - name: deny-sandbox-escape
    match:
      tool: fs__write_*
    decision: deny
    message: >-
      Writes must target a path under /tmp/guardrails-sandbox/. Write your file
      there, or show the user the change instead of applying it.

  # Moving a file is not obviously safe and not obviously fatal, which is the
  # shape of decision a human should make rather than a policy file. The call
  # waits while the MCP client asks; nothing is forwarded meanwhile, and an
  # approved call is charged to the budget like any other.
  #
  # This needs a client that supports elicitation. One that does not gets a
  # clear refusal, not a silent allow - see the README's approval section.
  - name: approve-moves
    match:
      tool: fs__move_*
    decision: require_approval
    cost: 5
    approval:
      timeout_s: 120
      # Silence is not consent: the usual reason nobody answered is that nobody
      # was looking, which is when a move should least of all happen unattended.
      on_timeout: deny
      prompt: >-
        The agent wants to move or rename a file in the sandbox. Approve?

  # The safety net underneath the named rules: anything the downstream server
  # flags as destructive, including every tool that declares no annotations at
  # all, because the MCP default for destructiveHint is true. This is what
  # covers a tool added next month that nobody has written a rule for yet.
  #
  # Annotations are hints from an upstream server, so treat this as a blanket,
  # not a guarantee - a hostile server can describe its delete tool as harmless.
  - name: deny-destructive
    match:
      annotations:
        destructiveHint: true
    decision: deny
    message: >-
      Destructive tools are disabled in this sandbox. Ask the user to perform
      the change manually if it is genuinely required.
