name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch instead of burning minutes on
# commits nobody is waiting for any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs, not tags. A tag like @v5 is
# mutable: whoever controls the repo can repoint it at new code, which would
# execute in this workflow. A security tool whose own CI is trivially
# supply-chain attackable is not a good look. Comments record the human tag.
#
# persist-credentials: false stops checkout leaving a usable GITHUB_TOKEN in
# .git/config, where any later step (or dependency) could read it.

jobs:
  # Linting is its own job rather than a step inside the matrix. It is platform
  # independent, so running it three times only makes the pipeline slower, and
  # it covers the Python and shell tooling the .NET build cannot see at all -
  # scripts/smoke.py is the integration test and scripts/coverage.sh is the
  # coverage gate, so both are load-bearing CI code and are linted like source.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Restore
        run: dotnet restore

      # Whitespace, code style and analyzer rules, all driven by .editorconfig,
      # so the command that decides the outcome here is the one developers
      # already run locally.
      - name: Verify C# formatting
        run: dotnet format --verify-no-changes

      # Pinned version: a linter that changes its mind between runs turns a
      # green PR red without anyone pushing a commit.
      - name: Lint Python
        run: |
          pipx install ruff==0.16.6
          ruff check scripts
          ruff format --check scripts

      - name: Lint shell
        run: shellcheck scripts/*.sh .githooks/*

  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't kill the other platforms when one fails - a failure specific to a
      # single OS is exactly the information we want.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          # Honour global.json rather than pinning the version twice.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        # Directory.Build.props sets TreatWarningsAsErrors, so any new warning
        # (including the AOT-compatibility analyzers) fails the build here.
        run: dotnet build --no-restore --configuration Release

      # --logger trx leaves a machine-readable result file behind, so a failure
      # can be inspected from the artifact instead of by scrolling the log.
      #
      # One line on purpose: this matrix includes windows-latest, where `run`
      # executes in PowerShell and a trailing backslash is not a line
      # continuation - it parses as a unary operator and fails before dotnet is
      # ever invoked.
      - name: Test
        run: >-
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        # always(), because the results are most useful precisely when the step
        # above failed.
        if: always()
        # actions/upload-artifact v5
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          # warn, not error: if the test step died before writing a trx, the
          # test failure is the story and a second red step only hides it.
          if-no-files-found: warn

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      # Same script developers run locally, so a green local run means a green
      # pipeline. Fails the build if coverage drops below the ratchet.
      - name: Test with coverage
        run: ./scripts/coverage.sh

      - name: Upload coverage report
        if: always()
        # actions/upload-artifact v5
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: coverage
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: error

  # The unit tests never touch a real MCP server. This job proves the whole
  # chain works: driver -> proxy -> spawned Node filesystem server -> disk.
  end-to-end:
    name: end-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Build
        run: dotnet build --configuration Release

      # The Linux runner has Docker, so the container isolation phase must run
      # here: with this set, a missing Docker is a failure instead of a SKIP.
      - name: Smoke test through a real downstream server
        env:
          SMOKE_REQUIRE_DOCKER: "1"
        run: |
          python3 scripts/smoke.py \
            src/McpGuardrails.Cli/bin/Release/net10.0/McpGuardrails.Cli

      # Examples are documentation, and documentation rots. Loading each one
      # through the real loader proves the policy syntax in the README still
      # parses - a malformed policy is a fatal startup error, so a non-zero exit
      # here means we shipped an example nobody could use.
      - name: Validate the example policies
        run: |
          BIN=src/McpGuardrails.Cli/bin/Release/net10.0/McpGuardrails.Cli
          # A pins file that does not exist: listing never writes one, and
          # nothing on the runner should be compared against.
          PINS="$RUNNER_TEMP/no-pins/pins.json"
          for policy in examples/*.yaml; do
            echo "checking $policy"
            GUARDRAILS_SERVERS="" GUARDRAILS_PINS="$PINS" GUARDRAILS_POLICY="$policy" "$BIN" list-upstream > /dev/null
          done

      # The packs ship inside the binary and users build their policy from
      # them, so parsing is not enough: each must decide every case in its test
      # file the way the file says.
      - name: Test the policy packs
        run: |
          src/McpGuardrails.Cli/bin/Release/net10.0/McpGuardrails.Cli policy test packs/*.test.yaml
